<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <h:form id="settingsForm">
            <p:growl id="messages" showDetail="true" autoUpdate="true"/>

            <p:panel header="إعدادات الحجز">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="breakfastStart" value="بداية الإفطار"/>
                    <p:datePicker id="breakfastStart" value="#{reservationSettingsBean.settings.breakfastStart}"
                                  timeOnly="true" pattern="HH:mm"/>

                    <p:outputLabel for="breakfastEnd" value="نهاية الإفطار"/>
                    <p:datePicker id="breakfastEnd" value="#{reservationSettingsBean.settings.breakfastEnd}"
                                  timeOnly="true" pattern="HH:mm"/>

                    <p:outputLabel for="lunchStart" value="بداية الغداء"/>
                    <p:datePicker id="lunchStart" value="#{reservationSettingsBean.settings.lunchStart}"
                                  timeOnly="true" pattern="HH:mm"/>

                    <p:outputLabel for="lunchEnd" value="نهاية الغداء"/>
                    <p:datePicker id="lunchEnd" value="#{reservationSettingsBean.settings.lunchEnd}"
                                  timeOnly="true" pattern="HH:mm"/>

                    <p:outputLabel for="dinnerStart" value="بداية العشاء"/>
                    <p:datePicker id="dinnerStart" value="#{reservationSettingsBean.settings.dinnerStart}"
                                  timeOnly="true" pattern="HH:mm"/>

                    <p:outputLabel for="dinnerEnd" value="نهاية العشاء"/>
                    <p:datePicker id="dinnerEnd" value="#{reservationSettingsBean.settings.dinnerEnd}"
                                  timeOnly="true" pattern="HH:mm"/>
                </h:panelGrid>

                <p:commandButton value="حفظ" action="#{reservationSettingsBean.saveSettings}" update="messages"/>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
