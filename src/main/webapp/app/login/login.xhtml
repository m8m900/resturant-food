<html xmlns = "http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <style type="text/css">
        .ui-button {
            width: 300px !important;
            background: #D6D1C7 !important;
            color: black !important;
            border: none !important;
            border-radius: 4px !important;
            font-family: cursive !important;
        }
        .ui-button:hover{
            background-color: #CBCBCB !important;
        }
        .input{
            width: 300px ;
            height: 40px;
            border: none;
            border-radius: 4px !important;
            font-family: cursive !important ;
            margin-bottom: 20px;
        }
        .password{
            width: 300px ;
            height: 40px;
            border: none;
            border-radius: 4px !important;
            font-family: cursive !important;
            margin-bottom: 20px;
        }
    </style>
</h:head>
<h:body style="margin: 0 0 0 0; ">
    <h:form>
    <div style="background-color: #D9D9D9; display: flex; justify-content: space-between; align-items: center; padding: 10px;">
        <p:graphicImage style="height: 85px; margin: 5px; " value="/resources/images/img_1.png" />
        <p:graphicImage style="height: 110px; margin: 5px;" value="/resources/images/img_2.png"  />
    </div>
        <div style="display: grid; grid-template-columns: 40% 60%;  ">
            <div style=" background: #D3C5AC; display: flex; flex-direction: column; padding: 20px 20px; justify-content: center;  align-items: center; width: 100%; height: 100%;" dir="rtl">

                <p:inputText styleClass="input" id="username" value="#{userController.username}"  placeholder="اسم المستخدم"  />
                <p:password styleClass="password" id="password" value="#{userController.password}" style="width: 300px; margin-bottom: 20px; " placeholder="كلمة المرور"  />

                <p:commandButton  styleClass="ui-button"  value="تسجيل الدخول" actionListener="#{userController.init}"
                                  action="#{userController.login}" process="@form" update="@form"/>
            </div>

            <div  >
                <p:graphicImage value="/resources/images/img.png" style="width: 100%;  " />
            </div>
        </div>
        <div style="background-color: #D9D9D9; display: flex; justify-content: space-between; align-items: center; padding: 10px; margin: 0 0 0 0;">
          <h1> v1 </h1>
            <h1> قسم البرمجة </h1>

        </div>
    </h:form>

</h:body>
</html>
