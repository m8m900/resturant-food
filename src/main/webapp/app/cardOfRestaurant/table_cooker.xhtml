<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">
    <h:head>
    </h:head>
    <ui:define name="content">
        <h:form id="form">
            <h:messages globalOnly="true" />
            <p:dataTable var="food" dir="rtl" value="#{restaurantCardController.restaurantCardList}" editable="true" id="dataTable" >
                <p:column headerText=" اسم المطعم " sortBy="#{food.name}" filterBy="#{food.name}" filterMatchMode="contains" filterPlaceholder="Filter By Name">
                    <h:outputText value="#{food.name}" />
                </p:column>
                <p:column headerText=" موقع المطعم " sortBy="#{food.site}" filterBy="#{food.site}" filterMatchMode="contains" filterPlaceholder="Filter By Name">
                    <h:outputText value="#{food.site}" />
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
