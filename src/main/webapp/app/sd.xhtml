<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>استمارة معلومات الناخب</title>
    <style>
        .form-title {
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
            color: #006699;
        }

        .section-title {
            margin-top: 30px;
            font-size: 18px;
            color: #444;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
            text-align: right;
            direction: rtl;
        }

        .info-box {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            direction: rtl;
            text-align: right;
        }

        /* كل سطر بيانات في معلومات الناخب */
        .info-row {
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: flex-start; /* content from right to left */
            align-items: center;
            gap: 10px;
        }

        /* لإزالة آخر خط فاصل */
        .info-row:last-child {
            border-bottom: none;
        }

        .label-cell {
            font-weight: bold;
            color: #fff;
            background-color: #4CAF50; /* خلفية خضراء للعناوين */
            padding: 5px 12px;
            border-radius: 4px;
            min-width: 140px;
            text-align: center;
            flex-shrink: 0;
        }

        .value {
            padding: 4px 8px;
            min-width: 150px;
            flex-grow: 1;
            word-wrap: break-word;
        }

        /* تصميم بطاقات الأقارب */
        .relative-member-card {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px 20px;
            margin: 10px;
            box-shadow: 1px 1px 6px #ccc;
            width: 280px;
            display: inline-block;
            vertical-align: top;
            direction: rtl;
            text-align: right;
        }

        /* كل سطر داخل بطاقة الأقارب */
        .relative-member-row {
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
        }

        .relative-member-row:last-child {
            border-bottom: none;
        }

        /* لضبط تخطيط البطاقات */
        .relatives-container {
            text-align: right;
            direction: rtl;
            margin-top: 10px;
        }
    </style>
</h:head>

<h:body>
    <h:form>

        <p:panel header="استمارة معلومات الناخب" styleClass="form-title">

            <h3 class="section-title">معلومات الناخب</h3>
            <div class="info-box">
                <div class="info-row">
                    <span class="label-cell">الاسم الكامل:</span>
                    <span class="value"></span>
                </div>
                <div class="info-row">
                    <span class="label-cell">رقم البطاقة:</span>
                    <span class="value"></span>
                </div>
                <div class="info-row">
                    <span class="label-cell">تاريخ الميلاد:</span>
                    <span class="value">
                        <h:outputText>
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </span>
                </div>
                <div class="info-row">
                    <span class="label-cell">المحافظة:</span>
                    <span class="value"></span>
                </div>
            </div>

            <!-- أقارب الناخب -->
            <h3 class="section-title">المحدثين المرتبطين بالناخب</h3>
            <div class="relatives-container">
                <ui:repeat value="null" var="member">
                    <div class="relative-member-card">
                        <div class="relative-member-row">
                            <span class="label-cell">الرقم:</span>
                            <span class="value"></span>
                        </div>
                        <div class="relative-member-row">
                            <span class="label-cell">الاسم الكامل:</span>
                            <span class="value"></span>
                        </div>
                        <div class="relative-member-row">
                            <span class="label-cell">صلة القرابة:</span>
                            <span class="value"></span>
                        </div>
                        <div class="relative-member-row">
                            <span class="label-cell">الجنس:</span>
                            <span class="value"></span>
                        </div>
                        <div class="relative-member-row">
                            <span class="label-cell">المحافظة</span>
                            <span class="value"></span>
                        </div>
                        <div class="relative-member-row">
                            <span class="label-cell">عنوان السكن التفصيلي </span>
                            <span class="value"></span>
                        </div>
                        <div class="relative-member-row">
                            <span class="label-cell">تاريخ الميلاد:</span>
                            <span class="value">
                                <h:outputText>
                                    <f:convertDateTime pattern="dd/MM/yyyy" />
                                </h:outputText>
                            </span>
                        </div>
                    </div>
                </ui:repeat>
            </div>

        </p:panel>

    </h:form>
</h:body>
</html>
