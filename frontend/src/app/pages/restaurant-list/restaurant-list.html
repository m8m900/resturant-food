<p-table
  dir="rtl"
  [value]="restaurants"
  [sortMode]="'multiple'"
  [rows]="10"
  dataKey="id"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="name">
        اسم المطعم
      </th>
      <th pSortableColumn="site">
        موقع المطعم
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-restaurant>
    <tr>
      <td>{{ restaurant.name }}</td>
      <td>{{ restaurant.site }}</td>
    </tr>
  </ng-template>
</p-table>
