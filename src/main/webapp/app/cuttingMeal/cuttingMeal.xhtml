<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template.xhtml">

   <ui:define name="content">
      <h:form id="mealForm">
         <p:growl id="messages" showDetail="true"/>

         <!-- عرض أيام الأسبوع -->
         <p:dataTable  var="day" type="ordered">
            <f:facet name="header">
               <h:outputText value="وجبات الأسبوع" style="font-size: 18px; font-weight: bold;"/>
            </f:facet>

            <!-- عنوان اليوم -->
            <h:outputText value="#{day.name}" style="font-size: 16px; font-weight: bold; color: #2c3e50;"/>

            <!-- عرض الوجبات لكل يوم -->
            <p:dataTable value="#{day.meals}" var="meal" style="margin-bottom: 20px;">
               <p:column headerText="نوع الوجبة">
                  <h:outputText value="#{meal.type}" />
               </p:column>

               <p:column headerText="الحالة">
                  <h:outputText value="#{meal.cut ? 'مقطوعة' : 'محجوزة'}" />
               </p:column>

               <p:column headerText="الإجراء">
                  <p:commandButton value="قطع"
                                   process="@this" update="mealForm messages"
                                   styleClass="ui-button-danger" icon="pi pi-times"
                                   disabled="#{meal.cut}">
                     <p:confirm header="تأكيد" message="هل أنت متأكد من قطع هذه الوجبة؟" icon="pi pi-exclamation-triangle"/>
                  </p:commandButton>
               </p:column>
            </p:dataTable>
         </p:dataTable>

         <!-- تأكيد قطع الوجبة -->
         <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="نعم" type="button" styleClass="ui-button-danger" icon="pi pi-check"
                             onclick="PF('confirmDialog').hide();" />
            <p:commandButton value="لا" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                             onclick="PF('confirmDialog').hide();" />
         </p:confirmDialog>
      </h:form>
   </ui:define>
</ui:composition>
