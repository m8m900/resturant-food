<p-panel header="الإحصائيات" dir="rtl">
  <p>عدد الأفراد الذين حجزوا فطور: {{ breakfastCount }}</p>
  <p>عدد الأفراد الذين حجزوا غداء: {{ lunchCount }}</p>
  <p>عدد الأفراد الذين حجزوا عشاء: {{ dinnerCount }}</p>

  <div class="charts">
    <div class="chart-box">
      <h4>إحصائيات الفطور</h4>
      <p-chart type="pie" [data]="breakfastChart" />
    </div>
    <div class="chart-box">
      <h4>إحصائيات الغداء</h4>
      <p-chart type="pie" [data]="lunchChart" />
    </div>
    <div class="chart-box">
      <h4>إحصائيات العشاء</h4>
      <p-chart type="pie" [data]="dinnerChart" />
    </div>
  </div>
</p-panel>
